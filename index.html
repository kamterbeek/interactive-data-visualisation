<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Data Visualisation Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>

    <script src="sketch.js"></script>

    <!-- Visualisations -->
    <script src="tech-diversity-race.js"></script>
    <script src="tech-diversity-gender.js"></script>
    <script src="pay-gap-by-job-2017.js"></script>
    <script src="pay-gap-1997-2017.js"></script>
    <script src="climate-change.js"></script>

    <!-- Supporting files -->
    <script src="helper-functions.js"></script>
    <script src="gallery.js"></script>
    <script src="pie-chart.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Data Visualisation Dashboard</h1>

        <!-- Main visualisation selector -->
        <div id="controls">

            <label for="graphSelect">
                Select visualisation:
            </label>

            <select id="graphSelect">

                <option value="">
                    Select a visualisation
                </option>

                <option value="tech-diversity-race">
                    Tech Diversity: Race
                </option>

                <option value="tech-diversity-gender">
                    Tech Diversity: Gender
                </option>

                <option value="pay-gap-by-job-2017">
                    Pay Gap by Job - 2017
                </option>

                <option value="pay-gap-timeseries">
                    Pay Gap 1997-2017
                </option>

                <option value="climate-change">
                    Climate Change
                </option>

            </select>

        </div>

        <!--
            Individual visualisations can place their
            controls here, such as filters and sliders.
        -->
        <div id="visualControls"></div>

    </header>


    <!--
        The original Gallery expects this element.
        We keep it in the page but hide it because
        the dashboard dropdown is now the main selector.
    -->
    <ul id="visuals-menu" style="display: none;"></ul>


    <!-- p5.js canvas -->
    <main id="app"></main>

</body>

</html>
